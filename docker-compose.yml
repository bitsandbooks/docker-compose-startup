---
name: ${PROJECT_NAME}
networks:
  default:
    name: ${HOST_GROUP_NAME}
    # external: true # -- If network already exists, use this and comment out the rest
    # -- For specific subnets, use or modify the configuration below
    driver: bridge
    attachable: true
    # internal: true # -- (optional) If Internet access is unneeded for this network
    enable_ipv6: false # -- (optional) affects IPv6 subnet line below
    # ipam:
    #   # for defining specific network ranges
    #   config:
    #     - subnet:  172.18.0.0/24
    #       gateway: 172.18.0.1
    #     - subnet: fe80:db8::/64

include:
  # -- Include service files listed in ${HOST_COMPOSE_FOLDER} below to launch
  #    them when Docker becomes available on startup, using the same pattern as
  #    in the example below. If a service does not require an env_file, simply
  #    leave that line out.
  # - path:     ${HOST_COMPOSE_FOLDER}/servicename.yml
  #   env_file: ${HOST_COMPOSE_FOLDER}/servicename.env

  # -- Essential services; do not comment out or change without
  #    a very, VERY good reason!
  - path:     ${HOST_COMPOSE_FOLDER}/1-essential.yml # -- Docker socket proxy, DNS and reverse proxy services for the LAN

  # -- Shared services; each filename should start with "2-". Comment out
  #    to manually manage the service, or remove the line to disable it.
  - path:     ${HOST_COMPOSE_FOLDER}/2-databases.yml
    env_file: ${HOST_COMPOSE_FOLDER}/2-databases.env
  - path:     ${HOST_COMPOSE_FOLDER}/2-plex.yml
  - path:     ${HOST_COMPOSE_FOLDER}/3-syncthing.yml
  - path:     ${HOST_COMPOSE_FOLDER}/3-portainer.yml
  - path:     ${HOST_COMPOSE_FOLDER}/3-homepage.yml
  - path:     ${HOST_COMPOSE_FOLDER}/3-backrest.yml
