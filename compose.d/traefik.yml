secrets:
  DO_AUTH_TOKEN:
    # -- Since we're using DigitalOcean's DNS to verify our Let's Encrypt
    #    certificates for the local network, we need a DO API token (available at
    #    https://cloud.digitalocean.com/account/api/tokens ), which is stored in a
    #    special "secrets" mount (such as a LUKS volume)
    file: "${HOST_DATA_FOLDER}/secrets/${TRAEFIK_ACME_TOKEN_FILE:-traefik-acme-token.txt}"
services:
  traefik:
    depends_on:
      - docker-proxy
    image: "traefik:${TRAEFIK_IMAGE_VERSION:-3}"
    container_name: traefik
    security_opt:
      - "no-new-privileges:true"
    secrets:
      - DO_AUTH_TOKEN
    environment:
      # TODO: Which format?
      - "DO_AUTH_TOKEN_FILE=/run/secrets/DO_AUTH_TOKEN"
      - "DO_AUTH_TOKEN__FILE=/run/secrets/DO_AUTH_TOKEN"
    expose:
      - "${TRAEFIK_DASHBOARD_PORT:-8080}" # -- Dashboard
    ports:
      - "${HOST_IPV4_LOCAL}:80:80" # -- HTTP
      - "${HOST_IPV4_LOCAL}:443:443" # -- HTTPS
    volumes:
      - "${HOST_DATA_FOLDER}/apps/traefik/config/traefik.yaml:/etc/traefik/traefik.yaml:ro" # -- config file
      - "${HOST_DATA_FOLDER}/apps/traefik/logs:/var/log/traefik:rw" # -- for logs
      - "${HOST_DATA_FOLDER}/apps/traefik/sites:/etc/traefik/sites.d:ro" # -- for File provider
      - "${HOST_DATA_FOLDER}/secrets/traefik/certs:/etc/traefik/certs:rw" # -- for Let's Encrypt certificates
      - "${HOST_DATA_FOLDER}/secrets/traefik/live:/etc/traefik/live:rw" # -- (optional) for .pem files
    labels:
      - "com.nihilsum.class=composed"
      - "com.nihilsum.service:startup=true"
      - "com.nihilsum.service:base=true"
      - "io.containers.autoupdate=registry"
      - "homepage.group=Top Services"
      - "homepage.name=Traefik Dashboard"
      - "homepage.icon=traefik.png"
      - "homepage.href=https://${HOST_NAME}.${DNS_ZONE_LOCAL}:${TRAEFIK_DASHBOARD_PORT:-8080}/"
      - "homepage.description=Dashboard for ${HOST_NAME}'s reverse proxy"
      - "homepage.widget.type=traefik"
      - "homepage.widget.url=http://traefik:${TRAEFIK_DASHBOARD_PORT:-8080}"
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_CPU_LIMIT:-${DEFAULT_CPU_LIMIT}}"
          memory: "${TRAEFIK_MEMORY_LIMIT:-${DEFAULT_MEMORY_LIMIT}}"
      restart_policy:
        condition: "on-failure"
        max_attempts: 10
